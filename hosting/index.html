<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرقان - المصحف الشريف</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .logo { font-size: 64px; color: #d4af37; font-weight: 700; margin-bottom: 12px; }
        .tagline { font-size: 20px; color: #999; margin-bottom: 48px; }
        .links a {
            color: #d4af37;
            text-decoration: none;
            margin: 0 16px;
            font-size: 16px;
            padding: 10px 24px;
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 8px;
            transition: all 0.3s;
        }
        .links a:hover {
            background: rgba(212,175,55,0.1);
            border-color: #d4af37;
        }
    </style>
</head>
<body>
    <div class="logo">فرقان</div>
    <div class="tagline">المصحف الشريف بين يديك</div>
    <div class="links">
        <a href="/privacy">سياسة الخصوصية</a>
        <a href="/about">من نحن</a>
    </div>
</body>
</html>
